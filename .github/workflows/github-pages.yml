name: Deploy Homelab Topology
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment

concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    name: Build Topology
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            ${{ env.NIX_CONFIG }}
      - name: Cache Nix store
        # Pull-only from this repo's public Cachix cache, replacing the
        # DeterminateSystems action that needed a SHA pin to survive its
        # FlakeHub 401 failures. The topology closure is small and rebuilt
        # here anyway, so no push is needed. Best-effort by design.
        uses: cachix/cachix-action@v17
        continue-on-error: true
        with:
          name: felixschausberger
          skipPush: true
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build homelab topology
        run: |
          nix build .#homelab-topology --accept-flake-config
          mkdir -p _site
          cp docs/site/index.html _site/
          mkdir -p _site/topology
          cp result/* _site/topology/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
