name: Deploy Homelab Topology
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment

concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    name: Build Topology
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Nix
        # Pull-only from the public Cachix cache; the topology closure is
        # small and rebuilt here anyway.
        uses: ./.github/actions/nix-setup
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build homelab topology
        run: |
          nix build .#homelab-topology --accept-flake-config
          mkdir -p _site
          cp docs/site/index.html _site/
          mkdir -p _site/topology
          cp result/* _site/topology/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
