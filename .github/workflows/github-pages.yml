name: Deploy Quality Dashboard + Homelab Topology
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment

concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    name: Build Dashboard + Topology
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            ${{ env.NIX_CONFIG }}
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Copy dashboard files
        run: |
          mkdir -p _site
          cp docs/site/index.html _site/
      - name: Build homelab topology
        run: |
          nix build .#homelab-topology --accept-flake-config
          mkdir -p _site/topology
          cp result/* _site/topology/
      - name: Generate metrics JSON
        run: |
          if [ -f ".quality-metrics/aggregate-coverage.json" ]; then
            jq -s '
              {
                timestamp: (.[0].timestamp // now | todate),
                aggregate_coverage: (.[0].aggregate_coverage // 0),
                critical_path_coverage: (.[0].critical_path_coverage // 0),
                test_suites: (.[0].test_suites // 0),
                snapshot_assertions: (.[0].snapshot_assertions // 0),
                dead_code: 0,
                unused_modules: 0,
                statix_issues: 0,
                eval_time: 0
              }
            ' .quality-metrics/aggregate-coverage.json > _site/metrics.json 2>/dev/null || \
            echo '{"timestamp":"'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'","aggregate_coverage":0,"critical_path_coverage":0,"test_suites":0,"snapshot_assertions":0,"dead_code":0,"unused_modules":0,"statix_issues":0,"eval_time":0}' > _site/metrics.json
          else
            echo '{"timestamp":"'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'","aggregate_coverage":0,"critical_path_coverage":0,"test_suites":0,"snapshot_assertions":0,"dead_code":0,"unused_modules":0,"statix_issues":0,"eval_time":0}' > _site/metrics.json
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
