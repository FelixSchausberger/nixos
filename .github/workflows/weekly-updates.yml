name: Weekly Dependency Updates
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
permissions:
  contents: write
  pull-requests: write
env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
jobs:
  update-flake:
    name: Update Flake Inputs and Snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Create weekly-updates branch from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --force
          git switch --force-create weekly-updates origin/main
      - name: Setup SSL certificates
        uses: ./.github/actions/setup-ssl
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            ${{ env.NIX_CONFIG }}
      - name: Update flake inputs
        run: nix flake update
      - name: Fix formatting and remove unused declarations
        run: |
          nix run nixpkgs#alejandra -- .
          nix run nixpkgs#deadnix -- --edit .
      - name: Update namaka snapshots
        run: |
          if ! nix run nixpkgs#namaka -- check; then
            nix run nixpkgs#namaka -- check --accept
            nix run nixpkgs#namaka -- check
          fi
      - name: Commit updates
        run: |
          git add flake.lock tests/_snapshots/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit --no-verify -m "chore: weekly dependency update"
          git push origin +weekly-updates
      - name: Create or update PR with auto-merge
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head weekly-updates --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base main \
              --head weekly-updates \
              --title "chore: weekly dependency update" \
              --label auto-merge \
              --body "## Weekly Dependency Update\n\nAutomated weekly update of flake inputs and required Namaka snapshots.\n\n**Validation:**\n- Flake inputs updated via \`nix flake update\`\n- Formatting and dead code removal applied\n- Namaka snapshot checks pass\n\n---\nTriggered by: \`${{ github.event_name }}\`\nWorkflow: weekly-updates.yml"
          fi
          # Re-fetch PR number after potential creation
          PR_NUMBER=$(gh pr list --head weekly-updates --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge --auto --rebase "$PR_NUMBER"
          fi
