name: Daily Dependency Updates
on:
  workflow_dispatch:
  schedule:
    # Poll every 6h: hosts converge via comin, so moving flake.lock is the
    # whole job. A PR is opened only once the candidate closure is
    # substitutable - either cache.nixos.org/Hydra already covered it, or,
    # after a 24h grace, the gap is built here and pushed to
    # felixschausberger.cachix.org so no host ever compiles it.
    - cron: "0 */6 * * *"
# Parallel triggers (cron + on-demand update-system.sh) would race the same
# PR branch; serialize instead of cancelling an in-flight lock refresh.
concurrency:
  group: daily-updates
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  update-flake:
    name: Update Flake Inputs and Snapshots
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      decision: ${{ steps.classify.outputs.decision }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Record base revision
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Nix
        uses: ./.github/actions/nix-setup
      - name: Update lock and snapshots
        run: |
          set -o pipefail
          # Captured so the PR body can document exactly which inputs moved.
          if ! nix flake update | tee update-output.txt; then
            echo "nix flake update failed - input sources may be unreachable" >&2
            exit 1
          fi

          if ! nix develop --command namaka check; then
            if [ -d tests/_snapshots/.pending ]; then
              find tests/_snapshots/.pending -type f ! -name '.gitignore' | while read -r file; do
                cp "$file" "tests/_snapshots/$(basename "$file")"
              done
              nix develop --command namaka check
            else
              echo "namaka check failed without pending snapshots" >&2
              exit 1
            fi
          fi

          {
            echo "## Daily Dependency Update"
            echo ""
            echo "Automated daily update of flake inputs and required Namaka snapshots."
            echo ""
            echo "### Updated inputs"
            echo ""
            if [ -s update-output.txt ]; then
              echo '```'
              cat update-output.txt
              echo '```'
            else
              echo "No input revisions changed."
            fi
            echo ""
            echo "**Validation:**"
            echo ""
            echo "- Namaka snapshot checks run in this workflow"
            echo "- CI validates flake evaluation and builds"
            echo "- PR is auto-merged when required checks pass"
            echo ""
            echo "---"
            echo "Triggered by: \`${{ github.event_name }}\`"
          } > pr-body.md
      - name: Classify cache coverage
        id: classify
        run: |
          set -euo pipefail
          # Package the lock/snapshot delta so the build and PR jobs reproduce
          # the candidate tree without re-running `nix flake update`.
          git add -A -- flake.lock tests/_snapshots
          if git diff --cached --quiet -- flake.lock tests/_snapshots; then
            echo "No lock or snapshot changes; nothing to publish."
            echo "decision=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --binary -- flake.lock tests/_snapshots > lock.patch

          # A dry-run lists derivations to *build* (uncached, potentially
          # expensive) versus paths to *fetch* (substitutable, cheap). Any
          # uncached derivation is a gap: the fast path is only safe when the
          # whole closure substitutes. The previous allow-list watched only a
          # handful of GUI/linux packages, so a broken-but-not-heavy package
          # (anyio 4.14.2, mosh, herdr) merged green and then failed the
          # post-merge cache warm-up.
          HEAVY='(^|/)[0-9a-z]{32}-(freecad|krita|blender|prusa-slicer|inkscape)-|(^|/)[0-9a-z]{32}-linux-[0-9]'
          gap=0
          heavy=0
          for host in desktop hp-probook-wsl m920q; do
            output=$(nix build ".#nixosConfigurations.$host.config.system.build.toplevel" --dry-run 2>&1 || true)
            built=$(printf '%s\n' "$output" | awk '/derivations will be built/{f=1;next} /paths will be fetched/{f=0} f' | grep -E '^[[:space:]]+/nix/store/' || true)
            count=$(printf '%s\n' "$built" | grep -cE '^[[:space:]]+/nix/store/' || true)
            if [ "$count" -gt 0 ]; then
              gap=1
              echo "::notice::$host has $count uncached derivation(s) to build before merge:"
              printf '%s\n' "$built" | head -10
              if printf '%s\n' "$built" | grep -qE "$HEAVY"; then
                heavy=1
              fi
            else
              echo "$host: closure fully substitutable"
            fi
          done

          if [ "$gap" -eq 0 ]; then
            echo "decision=fast" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Heavy nixpkgs packages are worth waiting for: Hydra builds them for
          # free and cache.nixos.org then serves them, so give the channel a
          # grace window (its tarball lastModified is the publish time) before
          # compiling them ourselves. Everything else - including our own
          # packages, which Hydra never builds - is compiled immediately, so a
          # broken dependency is caught before the PR opens instead of after
          # the merge.
          if [ "$heavy" -eq 1 ]; then
            locked_node=$(jq -r '.nodes.root.inputs.nixpkgs' flake.lock)
            locked_ts=$(jq -r --arg n "$locked_node" '.nodes[$n].locked.lastModified' flake.lock)
            age_hours=$(( ($(date +%s) - locked_ts) / 3600 ))
            if [ "$age_hours" -lt 24 ]; then
              echo "Heavy uncached closure, channel rev ${age_hours}h old (<24h); waiting for Hydra."
              echo "decision=wait" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Heavy uncached closure, channel rev ${age_hours}h old; building into Cachix before merge."
          else
            echo "Non-heavy uncached closure; building into Cachix before merge."
          fi
          echo "decision=build" >> "$GITHUB_OUTPUT"
      - name: Upload candidate tree
        if: steps.classify.outputs.decision == 'fast' || steps.classify.outputs.decision == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lock-candidate
          path: |
            lock.patch
            pr-body.md
          retention-days: 1
  # Pre-merge warm-up: build exactly the delta the substituters lack (Nix
  # still fetches anything Hydra did build) and push it to our own cache.
  # By the time the PR merges and comin converges, every host substitutes.
  build-and-push:
    name: Build and push ${{ matrix.host }}
    needs: update-flake
    if: needs.update-flake.outputs.decision == 'build'
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        host: [desktop, hp-probook-wsl, m920q]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update-flake.outputs.base_sha }}
          fetch-depth: 0
      - name: Setup Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Restore candidate tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lock-candidate
      - name: Apply candidate lock
        run: git apply --verbose lock.patch
      - name: Build and push closure
        run: |
          nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" --print-out-paths
          nix build ".#nixosConfigurations.${{ matrix.host }}.config.home-manager.users.schausberger.home.activationPackage" --print-out-paths
  create-pr:
    name: Open lock PR
    needs: [update-flake, build-and-push]
    if: |
      always() &&
      (needs.update-flake.outputs.decision == 'fast' ||
       (needs.update-flake.outputs.decision == 'build' && needs.build-and-push.result == 'success'))
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update-flake.outputs.base_sha }}
          fetch-depth: 0
      - name: Restore candidate tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lock-candidate
      - name: Apply candidate lock
        run: git apply --verbose lock.patch
      - name: Create or update PR
        id: create-pr
        # The branch push behind this step has failed with a transient
        # GitHub 500 (observed 2026-09-21); continue so the retry below runs.
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A PAT is mandatory here: PRs created with GITHUB_TOKEN do not
          # trigger pull_request workflows (GitHub anti-recursion rule), so
          # neither ci.yml's required "Quick Validation" check nor the
          # auto-merge workflow would ever run and the PR would stall open.
          token: ${{ secrets.LOCKS_UPDATE_PAT }}
          branch: daily-updates
          base: main
          title: "chore: daily dependency update"
          labels: auto-merge
          commit-message: "chore: daily dependency update"
          body-path: pr-body.md
      - name: Create or update PR (retry)
        # The action recomputes the candidate tree and only pushes when it
        # differs from the branch tip, so a retry after a failed push cannot
        # duplicate commits or PRs.
        if: steps.create-pr.outcome == 'failure'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.LOCKS_UPDATE_PAT }}
          branch: daily-updates
          base: main
          title: "chore: daily dependency update"
          labels: auto-merge
          commit-message: "chore: daily dependency update"
          body-path: pr-body.md
