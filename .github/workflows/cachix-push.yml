name: Build and Push to Cachix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  NIX_SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    ssl-cert-file = /etc/ssl/certs/ca-certificates.crt
    extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://nixpkgs-unfree.cachix.org https://pre-commit-hooks.cachix.org https://yazi.cachix.org https://claude-code.cachix.org https://niri-epireyn.cachix.org
    extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= nixpkgs-unfree.cachix.org-1:hqvoInulhbV4nJ9yJOEr+4wxhDV4xq2d1DK7S6Nqlt4= pre-commit-hooks.cachix.org-1:Pkk3Panw5AW24TOv6kz3PvLhlH8puAsJTBbOPmBo7Rc= yazi.cachix.org-1:ot2ynJHj5l8T+FaRjblM6YV3sLzuEEr/KK10lC3aIaA= claude-code.cachix.org-1:YeXf2aNu7UTX8Vwrze0za1WEDS+4DuI2kVeWEE4fsRk= niri-epireyn.cachix.org-1:tlVyFN7CtsDT+ZcLPS+ekFWeT1X6X4OqvWqbBMyIzFA=
    narinfo-cache-positive-ttl = 3600
    connect-timeout = 5
    stalled-download-timeout = 30
jobs:
  build-and-push:
    name: Build all hosts and push to cachix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup SSL certificates
        uses: ./.github/actions/setup-ssl
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            ${{ env.NIX_CONFIG }}
      - name: Install Cachix
        uses: cachix/cachix-action@v15
        with:
          name: felixschausberger
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # cachix-action automatically pushes every store path added
          # during the job to felixschausberger.cachix.org.
      - name: Build all host configurations
        run: |
          HOSTS="desktop surface portable hp-probook-wsl hp-probook-vmware m920q"
          for host in $HOSTS; do
            echo "Building $host toplevel..."
            nix build ".#nixosConfigurations.$host.config.system.build.toplevel" --print-out-paths
            echo "Building $host home activation..."
            nix build ".#nixosConfigurations.$host.config.home-manager.users.schausberger.home.activationPackage" --print-out-paths
          done
