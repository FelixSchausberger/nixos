name: Build and Push to Cachix
on:
  push:
    branches: [main]
  workflow_dispatch:
# A newer push to main queues behind the running one instead of cancelling
# it. Cancelling used to break the warm-up chain: cancelled runs never
# uploaded their closures, so hosts converged from an empty cache and spent
# hours compiling large packages locally. cachix uploads are idempotent
# per path, so queued serialized runs only cost runner minutes.
concurrency:
  group: cachix-push-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build-and-push:
    name: Build and push ${{ matrix.host }}
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        host: [desktop, hp-probook-wsl, m920q]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build ${{ matrix.host }} toplevel
        run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" --print-out-paths
      - name: Build ${{ matrix.host }} home activation
        run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.home-manager.users.schausberger.home.activationPackage" --print-out-paths
  # The portable recovery ISO is the USB rescue artifact (see hosts/portable).
  # Build it on every main push so it never rots into an unbootable state.
  build-portable-iso:
    name: Build and push installer-iso-portable
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build portable recovery ISO
        run: nix build .#installer-iso-portable --print-out-paths
