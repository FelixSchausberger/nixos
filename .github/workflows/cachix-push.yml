name: Build and Push to Cachix
on:
  push:
    branches: [main]
  workflow_dispatch:
# A newer push to main queues behind the running one instead of cancelling
# it. Cancelling used to break the warm-up chain: cancelled runs never
# uploaded their closures, so hosts converged from an empty cache and spent
# hours compiling large packages locally. cachix uploads are idempotent
# per path, so queued serialized runs only cost runner minutes.
concurrency:
  group: cachix-push-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # The warmed fleet is the key set of nixosConfigurations (flake.nix
  # lib.deployedHosts), so promoting or retiring a host automatically changes
  # the matrix instead of silently leaving a host unwarmed.
  deployed-hosts:
    name: Resolve the deployed host list
    runs-on: ubuntu-26.04
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Read lib.deployedHosts
        id: list
        run: echo "hosts=$(nix eval --json '.#lib.deployedHosts')" >> "$GITHUB_OUTPUT"
  build-and-push:
    name: Build and push ${{ matrix.host }}
    needs: deployed-hosts
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.deployed-hosts.outputs.hosts) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build ${{ matrix.host }}
        uses: ./.github/actions/build-host
        with:
          host: ${{ matrix.host }}
  # The portable ISO's outPath depends on content (nixpkgs rev + build date),
  # not the commit, so a push that leaves the ISO closure unchanged evals to
  # the path already in the cache. Rebuilding and re-pushing the multi-GB
  # artifact is then pure runner minutes (~35) plus the Cachix drain window
  # that run #419 raced against; query the cache instead and build only when
  # this commit's ISO is genuinely absent.
  iso-cache-state:
    name: Check the cache for the portable ISO
    runs-on: ubuntu-26.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nix
        uses: ./.github/actions/nix-setup
      - name: Compare the evaluated ISO against the cache
        id: check
        run: |
          out=$(nix eval --raw '.#installer-iso-portable' --apply 'p: toString p.outPath')
          echo "iso outPath: $out"
          if nix path-info --store https://felixschausberger.cachix.org "$out" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
  # The portable recovery ISO is the USB rescue artifact (see hosts/portable).
  # Build it whenever the cache does not hold this commit's exact ISO, so it
  # never rots into an unbootable state while identical pushes skip the
  # rebuild-and-push entirely.
  build-portable-iso:
    name: Build and push installer-iso-portable
    needs: iso-cache-state
    if: needs.iso-cache-state.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build portable recovery ISO
        run: nix build .#installer-iso-portable --print-out-paths
