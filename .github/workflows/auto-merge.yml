name: Auto Merge
on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'auto-merge')
    steps:
      - name: Enable auto-merge for PR
        env:
          # A PAT is required instead of GITHUB_TOKEN: merges performed with
          # GITHUB_TOKEN do not emit a push event, which would silently skip
          # on: push workflows like cachix-push.yml (cachix would never warm
          # for auto-merged commits).
          GH_TOKEN: ${{ secrets.LOCKS_UPDATE_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "🔄 Enabling auto-merge for PR #$PR_NUMBER"
          # Repo settings allow squash merges only; --merge is rejected by the API.
          gh pr merge --auto --squash "$PR_NUMBER" --repo "$REPO"
          echo "✅ Auto-merge enabled - PR will merge automatically when all checks pass"
