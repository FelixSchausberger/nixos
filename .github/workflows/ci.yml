name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# A newer push to a PR branch makes the previous validation run pointless, so
# cancel it. main pushes are never cancelled: every merge commit keeps a green
# record. "Quick Validation" and "Security Scan" are the required checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Security and compliance checks
  security:
    name: Security Scan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: github.token != ''
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && github.event_name != 'pull_request' && github.token != ''
        with:
          sarif_file: "trivy-results.sarif"
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        if: github.token != ''
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
        continue-on-error: true
  # Quick validation and linting
  validate:
    name: Quick Validation
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Nix
        uses: ./.github/actions/nix-setup
      - name: Run prek hooks
        run: |
          # First pass: let formatters (alejandra, etc.) modify files in-place.
          # Formatter hooks exit 1 when they change a file; that is expected here.
          echo "Running formatters (first pass — modifications allowed)..."
          nix develop --command prek run --all-files || true

          # Second pass: all hooks must now pass without modifying anything.
          # If a formatter still wants to change a file, the commit is genuinely dirty.
          echo "Verifying no further changes needed (second pass — must be clean)..."
          nix develop --command prek run --all-files
          echo "✅ All prek hooks passed"
      - name: Validate Fish shell configuration syntax
        run: |
          echo "🐟 Checking fish shell configuration syntax..."

          # Find all .fish files
          FISH_FILES=$(find . -name "*.fish" -not -path "./.git/*")

          if [ -z "$FISH_FILES" ]; then
            echo "No .fish files found to validate"
            exit 0
          fi

          # Validate syntax for each fish file
          ERRORS=0
          for file in $FISH_FILES; do
            echo "Checking: $file"
            if ! nix run nixpkgs#fish -- --no-execute "$file"; then
              echo "❌ Syntax error in $file"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "❌ Found $ERRORS fish syntax errors"
            exit 1
          fi

          echo "✅ All fish configurations have valid syntax"
      - name: Validate flake structure
        run: |
          echo "Validating flake metadata and structure..."
          nix flake metadata
          nix flake show
          echo "✅ Flake structure is valid"
      - name: Evaluate package derivations
        # nix flake show and nix flake check only force each package to WHNF:
        # a package with wrong callPackage arguments still reports as a valid
        # package there, and the breakage only surfaced later when the deploy
        # workflow built it. Forcing every drvPath instantiates each
        # derivation, which is where argument and eval errors appear.
        run: |
          nix eval --json .#packages.x86_64-linux \
            --apply 'ps: builtins.mapAttrs (_: v: v.drvPath) ps' > /dev/null
          echo "✅ All package derivations evaluated"
