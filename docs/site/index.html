<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NixOS Homelab Topology</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0d1117;
        color: #e6edf3;
        font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace;
        font-size: 14px;
        padding: 2rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
        color: #f0f6fc;
      }
      .subtitle {
        color: #7d8590;
        font-size: 0.8rem;
        margin-bottom: 2rem;
      }
      .topology {
        margin-top: 1rem;
      }
      .topology img {
        max-width: 100%;
        border: 1px solid #30363d;
        border-radius: 6px;
      }
      .topology a {
        color: #58a6ff;
        text-decoration: none;
      }
      .topology a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>NixOS Homelab Topology</h1>
    <p class="subtitle">Network topology and service inventory</p>
    <div class="topology" id="topology"></div>
    <script>
      // The homelab-topology package emits topology.svg + index.html into
      // _site/topology/ (github-pages.yml). Inline the SVG; if absent, hand
      // over to the fully styled generated page.
      fetch("topology/topology.svg")
        .then((r) => {
          if (!r.ok) throw new Error("Topology not available");
          return r.text();
        })
        .then((svg) => {
          document.getElementById("topology").innerHTML = svg;
        })
        .catch(() => {
          window.location.href = "topology/";
        });
    </script>
  </body>
</html>
