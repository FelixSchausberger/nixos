# Namaka snapshot testing configuration
# https://github.com/nix-community/namaka

[check]
# nix flake check doesn't emit trace: namaka= lines, so we use nix eval
# to trigger the snapshot checks. This matches the pre-commit hook command.
cmd = [
  "nix",
  "eval",
  ".#checks.x86_64-linux",
  "--extra-experimental-features",
  "flakes nix-command",
]
